name: Сборка APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (platform 34, build-tools 35)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;35.0.0" > /dev/null

      - name: Тесты правил
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node test/rules.test.mjs

      - name: Сборка APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Rialto-apk
          path: apk/Rialto.apk

      # Публикация APK как релиза: файл скачивается по ссылке
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/Rialto.apk
      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Риальто 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: apk/Rialto.apk
          body: |
            Установочный файл для Android — **Rialto.apk** (ниже, в разделе Assets).
            Откройте его на телефоне и разрешите установку из неизвестных источников.
            Нужен Android 7.0+ с обновлённым Android System WebView.
